# 复制为 config.toml 后再填写。config.toml 已被 git 忽略。
# 环境变量的优先级更高，见 README。不要把密钥提交到仓库。

[app]
data_dir = "data"
host = "127.0.0.1"
port = 8765

[llm]
# OpenAI 兼容接口。下面是常见写法，只保留一套。
# DeepSeek:  https://api.deepseek.com/v1          模型 deepseek-chat
# 通义千问:   https://dashscope.aliyuncs.com/compatible-mode/v1   模型 qwen-plus
# Grok:      https://api.x.ai/v1                  模型 grok-3
# 本地:      http://127.0.0.1:11434/v1            模型按本地服务填写，api_key 可留空
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
temperature = 0.7

[tts]
provider = "edge"
voice = "zh-CN-XiaoxiaoNeural"
rate = "+0%"

[stock]
# pexels | pixabay | ai | placeholder
provider = "pexels"
pexels_api_key = ""
pixabay_api_key = ""

[visual_ai]
# 可选。POST {base_url}/v1/videos ，见 README 的请求约定。
base_url = ""
api_key = ""
model = ""

[video]
aspect = "9:16"
fps = 30
clip_seconds = 4
bgm_volume = 0.14
preset = "veryfast"
crf = 23
# 0 表示按画幅使用 1080x1920 或 1920x1080
width = 0
height = 0

[youtube]
client_id = ""
client_secret = ""
redirect_uri = "http://127.0.0.1:8765/api/oauth/youtube/callback"

[upload]
# 登录建议有头浏览器，或用 cdp_url 附着本机 Chrome。
headless = false
cdp_url = ""
login_timeout = 180
